[project]
name = "b2b-contact-finder"
version = "0.1.0"
description = "Enrichissement de contacts B2B depuis un fichier Excel"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "azure-identity==1.25.3",
    "openai==2.30.0",
    "openpyxl==3.1.5",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [".venv"]
